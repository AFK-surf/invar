# `damage::Groups` against the native hosts' groups.h: the same floats of the same frames (scripts/check-linux-host.sh).
[package]
name = "groups_parity"
version = "0.1.0"
license = "MIT"

[dependencies]
damage = { path = ".." }

[link.linux]
c_sources = ["native/groups_parity.c"]
cc_flags = ["-O2", "-I../../host/native"]

[link.macos]
c_sources = ["native/groups_parity.c"]
cc_flags = ["-O2", "-I../../host/native"]
