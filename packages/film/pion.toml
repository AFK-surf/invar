[package]
name = "film"
version = "0.1.0"

license = "MIT"
[dependencies]
codec = { path = "../codec" }
damage = { path = "../damage" }
hostapi = { path = "../hostapi" }
host = { path = "../host" }
paint = { path = "../paint" }
signals = { path = "../signals" }
view = { path = "../view" }
ui = { path = "../ui" }

[link.macos]
c_sources = [
  "native/film_bridge.c",
]
cc_flags = ["-O2"]
frameworks = [
  "Foundation",
  "AVFoundation",
  "CoreMedia",
  "CoreVideo",
  "QuartzCore",
  "Metal",
  "ImageIO",
]

[link.linux]
c_sources = [
  "native/film_bridge.c",
]
cc_flags = ["-O2"]
