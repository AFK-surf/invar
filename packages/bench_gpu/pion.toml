[package]
name = "bench_gpu"
version = "0.1.0"

[dependencies]
host = { path = "../host" }
hostapi = { path = "../hostapi" }
film = { path = "../film" }
signals = { path = "../signals" }
view = { path = "../view" }
paint = { path = "../paint" }
damage = { path = "../damage" }
ui = { path = "../ui" }
lg = { path = "../lg" }
lg_pages = { path = "../lg_pages" }

[link.macos]
c_sources = ["compat/bench_gpu_clock.c"]
cc_flags = ["-O2"]
frameworks = [
  "Foundation",
  "Cocoa",
  "Metal",
  "QuartzCore",
  "CoreText",
  "CoreGraphics",
  "ImageIO",
  "AVFoundation",
  "CoreMedia",
  "CoreVideo",
  "WebKit",
]

[link.linux]
c_sources = ["compat/bench_gpu_clock.c"]
cc_flags = ["-O2"]
