[package]
name = "host"
version = "0.1.0"

[dependencies]
hostapi = { path = "../hostapi" }

[link.macos]
c_sources = [
  "compat/pion_mb_compat.c",
  "native/apple_render.m",
  "native/apple_text.m",
  "native/apple_image.m",
  "native/apple_listen.m",
  "native/apple_browser_login.m",
  "native/apple_passwords.m",
  "native/apple_views.m",
  "native/apple_stream.m",
  "native/apple_film.m",
  "native/mac_app.m",
]
cc_flags = ["-fobjc-arc", "-O2", "-Icompat", "-Inative"]
frameworks = [
  "Foundation",
  "AppKit",
  "Cocoa",
  "Metal",
  "QuartzCore",
  "CoreText",
  "CoreGraphics",
  "ImageIO",
  "CoreFoundation",
  "AVFoundation",
  "CoreMedia",
  "CoreVideo",
  "VideoToolbox",
  "WebKit",
  "Security",
  "Network",
  "AuthenticationServices",
  "UniformTypeIdentifiers",
  "UserNotifications",
  "GameController",
  "Photos",
]

[link.ios]
# iOS Metal native host (verified on iphonesimulator arm64 via scripts/check-ios-host.sh;
# ios_share.m is built as the separate Share.appex extension target when bundling an iOS app,
# and film_none.c can replace apple_film.m if offscreen MP4 recording is omitted).
c_sources = [
  "compat/pion_mb_compat.c",
  "native/apple_render.m",
  "native/apple_text.m",
  "native/apple_image.m",
  "native/apple_listen.m",
  "native/apple_browser_login.m",
  "native/apple_passwords.m",
  "native/apple_views.m",
  "native/apple_stream.m",
  "native/apple_film.m",
  "native/ios_app.m",
]
cc_flags = ["-fobjc-arc", "-O2", "-Icompat", "-Inative"]
frameworks = [
  "Foundation",
  "UIKit",
  "Metal",
  "QuartzCore",
  "CoreText",
  "CoreGraphics",
  "ImageIO",
  "CoreFoundation",
  "AVFoundation",
  "CoreMedia",
  "CoreVideo",
  "VideoToolbox",
  "WebKit",
  "Security",
  "Network",
  "AuthenticationServices",
  "UniformTypeIdentifiers",
  "UserNotifications",
  "GameController",
  "Photos",
  "PhotosUI",
  "SafariServices",
]

[link.linux]
# Linux EGL/GLES3 + GTK4 + Pango/Cairo + GdkPixbuf + libsoup-3.0 native host.
# System packages on Debian/Ubuntu: libgtk-4-dev libsoup-3.0-dev libepoxy-dev
# (WebKit/GStreamer are loaded dynamically via dlopen when present at runtime).
c_sources = [
  "compat/pion_mb_compat.c",
  "native/linux_render.c",
  "native/linux_text.c",
  "native/linux_image.c",
  "native/linux_listen.c",
  "native/linux_browser_login.c",
  "native/linux_views.c",
  "native/linux_stream.c",
  "native/linux_film.c",
  "native/linux_app.c",
]
cc_flags = [
  "-O2",
  "-Icompat",
  "-Inative",
  "-I/usr/include/gtk-4.0",
  "-I/usr/include/pango-1.0",
  "-I/usr/include/glib-2.0",
  "-I/usr/lib/x86_64-linux-gnu/glib-2.0/include",
  "-I/usr/include/harfbuzz",
  "-I/usr/include/freetype2",
  "-I/usr/include/libpng16",
  "-I/usr/include/fribidi",
  "-I/usr/include/cairo",
  "-I/usr/include/pixman-1",
  "-I/usr/include/gdk-pixbuf-2.0",
  "-I/usr/include/graphene-1.0",
  "-I/usr/lib/x86_64-linux-gnu/graphene-1.0/include",
  "-I/usr/include/libsoup-3.0",
  "-pthread",
]
libs = [
  "gtk-4",
  "cairo-gobject",
  "graphene-1.0",
  "epoxy",
  "pangocairo-1.0",
  "cairo",
  "pangoft2-1.0",
  "pango-1.0",
  "harfbuzz",
  "fontconfig",
  "freetype",
  "gdk_pixbuf-2.0",
  "soup-3.0",
  "gmodule-2.0",
  "gio-2.0",
  "gobject-2.0",
  "glib-2.0",
  "z",
  "m",
  "pthread",
  "dl",
]

[link.windows]
# Windows host backend (D3D11 + DirectWrite + WIC), upstream libs/mbui/src/host/win_* as of monoid@1eec0cd3ce. Written
# for MSVC (WRL, WinRT, Windows SDK): build with clang for x86_64-pc-windows-msvc (MinGW's headers lack Windows.Data.Pdf,
# WRL's Callback and WebView2). Run tools/fetch-webview2.sh first (WebView2's header and static loader).
c_sources = [
  "compat/pion_mb_compat.c",
  "native/win_render.cpp",
  "native/win_text.cpp",
  "native/win_image.cpp",
  "native/win_listen.c",
  "native/win_browser_login.c",
  "native/win_passwords.c",
  "native/win_passkeys.c",
  "native/win_notify.cpp",
  "native/win_a11y.cpp",
  "native/win_views.cpp",
  "native/win_stream.cpp",
  "native/win_app.c",
  "native/film_none.c",
]
cc_flags = ["-O2", "-Icompat", "-Inative", "-Inative/webview2/1.0.4258.31/build/native/include"]
objects = ["native/webview2/1.0.4258.31/build/native/x64/WebView2LoaderStatic.lib"]
libs = ["d3d11", "dxgi", "d3dcompiler", "dwrite", "d2d1", "windowscodecs", "ole32", "user32", "gdi32", "shell32", "dwmapi", "shlwapi", "ws2_32", "winhttp", "bcrypt", "webauthn", "uiautomationcore", "mfplat", "mfreadwrite", "mfuuid", "xinput"]
