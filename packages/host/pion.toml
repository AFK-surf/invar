[package]
name = "host"
version = "0.1.0"

[dependencies]
hostapi = { path = "../hostapi" }

[link.macos]
c_sources = [
  "compat/pion_mb_compat.c",
  "native/apple_render.m",
  "native/apple_text.m",
  "native/apple_image.m",
  "native/apple_listen.m",
  "native/apple_browser_login.m",
  "native/apple_passwords.m",
  "native/apple_views.m",
  "native/apple_stream.m",
  "native/apple_film.m",
  "native/mac_app.m",
]
cc_flags = ["-fobjc-arc", "-O2", "-Icompat", "-Inative"]
frameworks = [
  "Foundation",
  "AppKit",
  "Cocoa",
  "Metal",
  "QuartzCore",
  "CoreText",
  "CoreGraphics",
  "ImageIO",
  "CoreFoundation",
  "AVFoundation",
  "CoreMedia",
  "CoreVideo",
  "VideoToolbox",
  "WebKit",
  "Security",
  "Network",
  "AuthenticationServices",
  "UniformTypeIdentifiers",
  "UserNotifications",
  "GameController",
  "Photos",
]

