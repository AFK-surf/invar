# Invar multi-package workspace manifest (Pion P32-B).
#
# Covers all cross-platform pure-Pion core layers, native host/film packages,
# and flagship examples so root-level `pionc check --json`, `pionc test --json`,
# and `pionc test --package <name>` work out of the box on macOS and Linux.
#
# Excluded from default native workspace members:
#   - packages/host_web, packages/lg_web: wasm32-only (JS WebGL2 bridge externs)
#   - packages/invar_host, examples/metal_glass_shot, packages/render: macOS-only link targets

[workspace]
members = [
  # Layer 0 — pure-Pion foundations
  "packages/halt",
  "packages/dmath",
  "packages/codec",
  "packages/zip",
  "packages/signals",
  "packages/text",

  # Layer 1 — layout, typography, vector, paint, damage
  "packages/effect",
  "packages/flex",
  "packages/font",
  "packages/shape",
  "packages/pixels",
  "packages/paint",
  "packages/damage",
  "packages/skia",
  "packages/svg",

  # Host ABI, retained view tree, UI, motion, kit, Liquid Glass
  "packages/hostapi",
  "packages/view",
  "packages/headless",
  "packages/ui",
  "packages/motion",
  "packages/kit",
  "packages/lg",
  "packages/lg_pages",
  "packages/site",

  # Cross-platform native GPU host & offscreen film/picture
  "packages/host",
  "packages/film",

  # Layer verification & benchmarks
  "packages/layer0_check",
  "packages/layer1a_check",
  "packages/layer1b_check",
  "packages/bench",
  "packages/bench_gpu",
  "packages/lg_shots",

  # Flagship examples
  "examples/jsx_app",
  "examples/worker_app",
]

[workspace.dependencies]
halt = { path = "packages/halt" }
dmath = { path = "packages/dmath" }
codec = { path = "packages/codec" }
zip = { path = "packages/zip" }
signals = { path = "packages/signals" }
text = { path = "packages/text" }
effect = { path = "packages/effect" }
flex = { path = "packages/flex" }
font = { path = "packages/font" }
shape = { path = "packages/shape" }
pixels = { path = "packages/pixels" }
paint = { path = "packages/paint" }
damage = { path = "packages/damage" }
skia = { path = "packages/skia" }
svg = { path = "packages/svg" }
hostapi = { path = "packages/hostapi" }
host = { path = "packages/host" }
film = { path = "packages/film" }
view = { path = "packages/view" }
headless = { path = "packages/headless" }
ui = { path = "packages/ui" }
motion = { path = "packages/motion" }
kit = { path = "packages/kit" }
lg = { path = "packages/lg" }
lg_pages = { path = "packages/lg_pages" }
site = { path = "packages/site" }
