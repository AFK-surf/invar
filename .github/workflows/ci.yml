name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PION_SHA: fdca4e0c9e2e444111417b77e3d15803a959e10e

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 3
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_MACOS }}
      PION_RELEASE_SHA256: ${{ vars.PION_RELEASE_SHA256_MACOS }}
      # CI only reported the brotli -q 11 size of the 4.5-6 MB web builds (gzip -9 stays): 10-20 s of CPU per build.
      INVAR_WEB_BROTLI: "0"
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Sample CPU use for the timing report
        run: |
          nohup bash -c 'while :; do echo "$(date +%s) $(top -l 2 -s 1 -n 0 | grep "CPU usage" | tail -n 1)"; sleep 1; done' \
            > "$RUNNER_TEMP/cpu.log" 2>&1 < /dev/null &

      - name: Checkout invar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download prebuilt pion toolchain (optional)
        if: env.PION_RELEASE_URL != ''
        run: |
          if [ -z "$PION_RELEASE_SHA256" ]; then
            echo "PION_RELEASE_SHA256_MACOS must be set when PION_RELEASE_URL_MACOS is configured" >&2
            exit 1
          fi
          mkdir -p .pion/release
          curl -fsSL "$PION_RELEASE_URL" -o .pion/release/pion.tar.gz
          echo "${PION_RELEASE_SHA256}  .pion/release/pion.tar.gz" | shasum -a 256 -c -
          tar -xzf .pion/release/pion.tar.gz -C .pion/release
          rm -f .pion/release/pion.tar.gz

      - name: Restore pion toolchain cache (pionc2, qbe, libpionrt.a, pion_wasm_rt.mjs)
        if: env.PION_RELEASE_URL == ''
        id: pion-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
            .pion/runtime/pion_wasm_rt.mjs
          key: pion-v3-macos-arm64-${{ env.PION_SHA }}

      - name: Checkout pion
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_SHA }}
          path: .pion
          persist-credentials: false

      - name: Bootstrap pionc2 (Stage 0 -> Stage 2 fixed-point)
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          OUT_DIR="$PWD/.pion/out"
          COMPILER_DIR="$PWD/.pion/compiler"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          export PION_QBE="$OUT_DIR/qbe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"

          echo "=== [1/5] Build QBE + libpionrt.a + libpionrt_cli.a ==="
          sh .pion/scripts/build-qbe.sh "$PION_QBE"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c .pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c .pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"

          echo "=== [2/5] Stage 0: Seed -> pionc0 (arm64_apple --obj) ==="
          gzip -dc .pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/pionc-seed.ssa"
          "$PION_QBE" -t arm64_apple --obj -o "$TMP_DIR/pionc0.o" "$TMP_DIR/pionc-seed.ssa"
          cc "$TMP_DIR/pionc0.o" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"

          echo "=== [3/5] Stage 1: pionc0 -> pionc1 ==="
          mkdir -p "$TMP_DIR/cas_s1"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s1" "$OUT_DIR/pionc0" build \
            --emit-ssa "$OUT_DIR/stage1.ssa" \
            --emit-asm "$OUT_DIR/stage1.s" \
            -o "$OUT_DIR/pionc1" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"

          echo "=== [4/5] Stage 2: pionc1 -> pionc2 ==="
          mkdir -p "$TMP_DIR/cas_s2"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s2" "$OUT_DIR/pionc1" build \
            --emit-ssa "$OUT_DIR/stage2.ssa" \
            --emit-asm "$OUT_DIR/stage2.s" \
            -o "$OUT_DIR/pionc2" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"

          echo "=== [5/5] Fixed-point proof ==="
          if cmp -s "$OUT_DIR/stage1.ssa" "$OUT_DIR/stage2.ssa"; then
            cmp "$OUT_DIR/stage1.s" "$OUT_DIR/stage2.s"
            echo "Fixed-point (Stage 1 == Stage 2): BIT-FOR-BIT IDENTICAL"
          else
            mkdir -p "$TMP_DIR/cas_s3"
            PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s3" "$OUT_DIR/pionc2" build \
              --emit-ssa "$OUT_DIR/stage3.ssa" \
              --emit-asm "$OUT_DIR/stage3.s" \
              -o "$OUT_DIR/pionc3" \
              "$COMPILER_DIR/src/core" \
              "$COMPILER_DIR/src/cli/main.pion"
            cmp "$OUT_DIR/stage2.ssa" "$OUT_DIR/stage3.ssa"
            cmp "$OUT_DIR/stage2.s" "$OUT_DIR/stage3.s"
            echo "Fixed-point (Stage 2 == Stage 3): BIT-FOR-BIT IDENTICAL"
          fi

      - name: Save pion toolchain cache
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
            .pion/runtime/pion_wasm_rt.mjs
          key: pion-v3-macos-arm64-${{ env.PION_SHA }}

      - name: Configure pion toolchain env
        id: pion-env
        env:
          CAS_HASH: ${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/.pion/release" ]; then
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion/release"
            PION_ID="${PION_RELEASE_SHA256}"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion"
            PION_ID="${PION_SHA}"
          fi
          PIONC_BIN="$(find "$SEARCH_ROOT" -type f \( -name pionc2 -o -name pionc \) | head -n 1)"
          QBE_BIN="$(find "$SEARCH_ROOT" -type f -name qbe | head -n 1)"
          RT_LIB="$(find "$SEARCH_ROOT" -type f -name libpionrt.a | head -n 1)"
          WASM_RT="$(find "$SEARCH_ROOT" -type f -name pion_wasm_rt.mjs | head -n 1)"
          test -n "$PIONC_BIN" && chmod +x "$PIONC_BIN"
          test -n "$QBE_BIN" && chmod +x "$QBE_BIN"
          mkdir -p "${{ runner.temp }}/pion-cas" "${{ runner.temp }}/ci-json"
          echo "$(dirname "$PIONC_BIN")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC_BIN" >> "$GITHUB_ENV"
          echo "PION_QBE=$QBE_BIN" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$RT_LIB" >> "$GITHUB_ENV"
          echo "PION_CACHE_DIR=${{ runner.temp }}/pion-cas" >> "$GITHUB_ENV"
          echo "PION_CACHE_MAX_MB=1024" >> "$GITHUB_ENV"
          echo "CI_JSON_DIR=${{ runner.temp }}/ci-json" >> "$GITHUB_ENV"
          if [ -n "$WASM_RT" ]; then
            echo "PION_WASM_RT=$WASM_RT" >> "$GITHUB_ENV"
          fi
          CC_FP=$(cc --version 2>&1 | head -n 1 | tr -cs 'A-Za-z0-9._' '-' | cut -c1-36)
          echo "env_fp=${ImageOS:-macos}-${CC_FP}" >> "$GITHUB_OUTPUT"
          echo "pion_id=${PION_ID}" >> "$GITHUB_OUTPUT"
          # Saved CAS keys end in the run, so a save the timeout cuts off can never hold a key a later run needs.
          CAS_PREFIX="pion-cas-v3-macos-arm64-${ImageOS:-macos}-${CC_FP}-${PION_ID}"
          echo "cas_prefix=${CAS_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "cas_base=${CAS_PREFIX}-${CAS_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore pion CAS cache
        id: cas-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: ${{ steps.pion-env.outputs.cas_base }}-full
          restore-keys: |
            ${{ steps.pion-env.outputs.cas_base }}-full-
            ${{ steps.pion-env.outputs.cas_base }}-ws-
            ${{ steps.pion-env.outputs.cas_base }}
            ${{ steps.pion-env.outputs.cas_prefix }}-

      - name: Doctor, static audit, workspace type-check, reactive audit, web check & Web/Java/iOS/Apple native checks (parallel)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ci-logs" target

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "web-java ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            mkdir -p target/raw_premul_java target/frame_pacer_java
            PIDS=()
            node scripts/check-web-shaders.mjs & PIDS+=($!)
            node scripts/test-a11y-bridge.mjs & PIDS+=($!)
            node scripts/test-host-ime.mjs & PIDS+=($!)
            node scripts/test-host-web-perf.mjs & PIDS+=($!)
            node scripts/test-host-raw-premul.mjs & PIDS+=($!)
            node scripts/test-host-shader-prewarm.mjs & PIDS+=($!)
            (
              set -euo pipefail
              javac -d target/raw_premul_java android/app/src/main/java/dev/invar/RawPremul.java android/mail/RawPremulTest.java
              java -cp target/raw_premul_java dev.invar.RawPremulTest
            ) & PIDS+=($!)
            (
              set -euo pipefail
              javac -d target/frame_pacer_java android/app/src/main/java/dev/invar/FramePacer.java android/app/src/main/java/dev/invar/FrameScheduler.java android/app/src/main/java/dev/invar/RateVoter.java android/app/src/main/java/dev/invar/FrameTelemetry.java android/pacer/FramePacerTest.java android/pacer/FrameSchedulerPropertyTest.java
              java -cp target/frame_pacer_java dev.invar.FramePacerTest
              java -cp target/frame_pacer_java dev.invar.FrameSchedulerPropertyTest
            ) & PIDS+=($!)
            WJ_FAIL=0
            for p in "${PIDS[@]}"; do wait "$p" || WJ_FAIL=1; done
            exit "$WJ_FAIL"
          ) > "${{ runner.temp }}/ci-logs/web-java.log" 2>&1 &
          PID_WEB_JAVA=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "apple-native ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            INVAR_IOS_CC_JOBS=2 bash scripts/check-ios-host.sh
            cc -Wall -Werror -fobjc-arc packages/host/tests/apple_grab_nav_test.m \
              -framework Foundation -framework CoreGraphics -framework CoreVideo -framework ImageIO \
              -o target/apple_grab_nav_test
            cc -Wall -Werror -fobjc-arc -Ipackages/host/compat -Ipackages/host/native packages/host/tests/apple_text_test.m \
              -framework Foundation -framework AppKit -framework CoreText -framework CoreGraphics -framework ImageIO \
              -o target/apple_text_test
            cc -Wall -Wextra -Werror -O2 -Ipackages/host/native packages/host/tests/raw_premul_test.c \
              -lm -o target/raw_premul_test
            target/apple_grab_nav_test
            target/apple_text_test
            target/raw_premul_test
          ) > "${{ runner.temp }}/ci-logs/apple-native.log" 2>&1 &
          PID_APPLE=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "audit-gen ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            python3 scripts/invar doctor --json
            bash scripts/check-generated.sh
            python3 scripts/invar audit --json --require-reactive > "$CI_JSON_DIR/audit.json"
          ) > "${{ runner.temp }}/ci-logs/audit-gen.log" 2>&1 &
          PID_AUDIT=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "ws-check ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            python3 scripts/invar check --json > "$CI_JSON_DIR/ws_check.json"
          ) > "${{ runner.temp }}/ci-logs/ws-check.log" 2>&1 &
          PID_CHECK=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "reactive-audit ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            bash scripts/test-reactive-audit.sh
          ) > "${{ runner.temp }}/ci-logs/reactive-audit.log" 2>&1 &
          PID_REACTIVE=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "web-check ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            python3 scripts/invar web check --out-wasm "$CI_JSON_DIR/lg_web.wasm" --json > "$CI_JSON_DIR/web_check.json"
          ) > "${{ runner.temp }}/ci-logs/web-check.log" 2>&1 &
          PID_WEB_CHECK=$!

          FAIL=0
          wait "$PID_AUDIT" || {
            echo "::error::Doctor / check-generated / static audit failed"
            if [ -s "$CI_JSON_DIR/audit.json" ]; then
              echo "=== audit.json ==="
              cat "$CI_JSON_DIR/audit.json"
            fi
            FAIL=1
          }
          wait "$PID_CHECK" || {
            echo "::error::Workspace type-check failed"
            if [ -s "$CI_JSON_DIR/ws_check.json" ]; then
              echo "=== ws_check.json ==="
              cat "$CI_JSON_DIR/ws_check.json"
            fi
            FAIL=1
          }
          wait "$PID_REACTIVE" || { echo "::error::Reactive audit tests failed"; FAIL=1; }
          wait "$PID_WEB_CHECK" || {
            echo "::error::Web check (lg_web) failed"
            if [ -s "$CI_JSON_DIR/web_check.json" ]; then
              echo "=== web_check.json ==="
              cat "$CI_JSON_DIR/web_check.json"
            fi
            FAIL=1
          }
          wait "$PID_WEB_JAVA" || { echo "::error::Web/Java checks failed"; FAIL=1; }
          wait "$PID_APPLE" || { echo "::error::iOS/Apple native checks failed"; FAIL=1; }

          echo "=== Doctor, check-generated & static audit ==="
          cat "${{ runner.temp }}/ci-logs/audit-gen.log"
          echo "=== Workspace type-check ==="
          cat "${{ runner.temp }}/ci-logs/ws-check.log"
          echo "=== Reactive audit tests ==="
          cat "${{ runner.temp }}/ci-logs/reactive-audit.log"
          echo "=== Web check (lg_web) ==="
          cat "${{ runner.temp }}/ci-logs/web-check.log"
          echo "=== Web & Java checks ==="
          cat "${{ runner.temp }}/ci-logs/web-java.log"
          echo "=== iOS & Apple native checks ==="
          cat "${{ runner.temp }}/ci-logs/apple-native.log"
          exit "$FAIL"

      - name: Run unit tests (manifest-discovered, including host & film)
        run: |
          set -euo pipefail
          python3 scripts/invar test --json | tee "$CI_JSON_DIR/ws_test.json"

      - name: Save pion CAS cache (workspace checkpoint)
        if: ${{ !startsWith(steps.cas-cache.outputs.cache-matched-key, format('{0}-', steps.pion-env.outputs.cas_base)) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: ${{ steps.pion-env.outputs.cas_base }}-ws-${{ github.run_id }}-${{ github.run_attempt }}

      - name: invar CLI E2E, MT stress & JSX example (parallel)
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            SECONDS=0; trap 'echo "aux-checks ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            RUNS=3 bash examples/worker_app/scripts/verify-mt.sh
            "$PIONC" build -o /tmp/jsx_app examples/jsx_app
            rm -f /tmp/jsx_app
          ) > "${{ runner.temp }}/ci-logs/aux-checks.log" 2>&1 &
          PID_AUX=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "cli-e2e ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            INVAR_CLI_TEST_AUDIT_JSON="$CI_JSON_DIR/audit.json" \
            INVAR_CLI_TEST_WS_CHECK_JSON="$CI_JSON_DIR/ws_check.json" \
            INVAR_CLI_TEST_WS_TEST_JSON="$CI_JSON_DIR/ws_test.json" \
            INVAR_CLI_TEST_WEB_CHECK_JSON="$CI_JSON_DIR/web_check.json" \
            INVAR_CLI_TEST_LG_WASM="$CI_JSON_DIR/lg_web.wasm" \
              bash scripts/test-invar-cli.sh
          ) &
          PID_CLI=$!

          FAIL=0
          wait "$PID_CLI" || { echo "::error::invar CLI E2E tests failed"; FAIL=1; }
          wait "$PID_AUX" || { echo "::error::MT stress / JSX example failed"; FAIL=1; }
          echo "=== MT stress & JSX example ==="
          cat "${{ runner.temp }}/ci-logs/aux-checks.log"
          exit "$FAIL"

      - name: Save pion CAS cache
        if: ${{ !startsWith(steps.cas-cache.outputs.cache-matched-key, format('{0}-full-', steps.pion-env.outputs.cas_base)) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: ${{ steps.pion-env.outputs.cas_base }}-full-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Timing report
        if: always()
        run: python3 scripts/ci-timing-report.py

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job macos-arm64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::macos-arm64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_LINUX }}
      PION_RELEASE_SHA256: ${{ vars.PION_RELEASE_SHA256_LINUX }}
      # CI only reported the brotli -q 11 size of the 4.5-6 MB web builds (gzip -9 stays): 10-20 s of CPU per build.
      INVAR_WEB_BROTLI: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - name: Record job start
        id: job-meta
        run: |
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "os_fp=${ImageOS:-ubuntu}" >> "$GITHUB_OUTPUT"

      - name: Sample CPU use for the timing report
        run: |
          nohup bash -c 'while :; do echo "$(date +%s) $(head -n 1 /proc/stat)"; sleep 2; done' \
            > "$RUNNER_TEMP/cpu.log" 2>&1 < /dev/null &

      - name: Checkout invar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore Linux apt .deb cache
        id: apt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apt-debs
          key: linux-apt-debs-v2-${{ steps.job-meta.outputs.os_fp }}-gtk4-soup3-epoxy-mesa-ffmpeg

      - name: Download prebuilt pion toolchain (optional)
        if: env.PION_RELEASE_URL != ''
        run: |
          if [ -z "$PION_RELEASE_SHA256" ]; then
            echo "PION_RELEASE_SHA256_LINUX must be set when PION_RELEASE_URL_LINUX is configured" >&2
            exit 1
          fi
          mkdir -p .pion/release
          curl -fsSL "$PION_RELEASE_URL" -o .pion/release/pion.tar.gz
          echo "${PION_RELEASE_SHA256}  .pion/release/pion.tar.gz" | sha256sum -c -
          tar -xzf .pion/release/pion.tar.gz -C .pion/release
          rm -f .pion/release/pion.tar.gz

      - name: Restore pion toolchain cache (pionc2, qbe, libpionrt.a, pion_wasm_rt.mjs)
        if: env.PION_RELEASE_URL == ''
        id: pion-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
            .pion/runtime/pion_wasm_rt.mjs
          key: pion-v3-linux-x86_64-${{ env.PION_SHA }}

      - name: Checkout pion
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_SHA }}
          path: .pion
          persist-credentials: false

      - name: Install Linux dependencies & bootstrap pionc2 (parallel)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ci-logs"

          (
            set -eu
            SECONDS=0; trap 'echo "apt ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            APT_PKGS="libgtk-4-dev libsoup-3.0-dev libepoxy-dev libpango1.0-dev libfontconfig1-dev libgdk-pixbuf-2.0-dev zlib1g-dev pkg-config mesa-utils libgl1-mesa-dri ffmpeg"
            if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && ls /tmp/apt-debs/*.deb >/dev/null 2>&1; then
              echo "Installing cached .deb packages from /tmp/apt-debs"
              DPKG_OK=1
              sudo dpkg -i --force-unsafe-io --force-confold /tmp/apt-debs/*.deb || DPKG_OK=0
              APT_OK=1
              for pkg in $APT_PKGS; do
                if [ "$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null || true)" != "install ok installed" ]; then
                  APT_OK=0
                  break
                fi
              done
              if [ "$DPKG_OK" -ne 1 ] || [ "$APT_OK" -ne 1 ]; then
                echo "Cached .deb install incomplete; falling back to online apt-get install"
                sudo apt-get update -q
                # shellcheck disable=SC2086
                sudo apt-get install -y -q --no-install-recommends $APT_PKGS
              fi
            else
              mkdir -p /tmp/apt-debs
              sudo apt-get update -q
              # shellcheck disable=SC2086
              sudo apt-get install -y -q --no-install-recommends \
                -o Dir::Cache::Archives=/tmp/apt-debs \
                $APT_PKGS
              sudo rm -rf /tmp/apt-debs/lock /tmp/apt-debs/partial
              sudo chmod -R a+rX /tmp/apt-debs
            fi
          ) > "${{ runner.temp }}/ci-logs/apt.log" 2>&1 &
          PID_APT=$!

          PID_BOOT=""
          if [ -z "${PION_RELEASE_URL:-}" ] && [ "${{ steps.pion-cache.outputs.cache-hit }}" != "true" ]; then
            (
              set -eu
              OUT_DIR="$PWD/.pion/out"
              COMPILER_DIR="$PWD/.pion/compiler"
              TMP_DIR="$(mktemp -d)"
              trap 'rm -rf "$TMP_DIR"' EXIT
              mkdir -p "$OUT_DIR"
              export PION_QBE="$OUT_DIR/qbe"
              export PION_RT_LIB="$OUT_DIR/libpionrt.a"
              PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"

              echo "=== [1/5] Build QBE + libpionrt.a + libpionrt_cli.a ==="
              sh .pion/scripts/build-qbe.sh "$PION_QBE"
              cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
                -c .pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
              ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
              cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
                -c .pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
              ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"

              echo "=== [2/5] Stage 0: Seed -> pionc0 (amd64_sysv --obj) ==="
              gzip -dc .pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/pionc-seed.ssa"
              "$PION_QBE" -t amd64_sysv --obj -o "$TMP_DIR/pionc0.o" "$TMP_DIR/pionc-seed.ssa"
              cc "$TMP_DIR/pionc0.o" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"

              echo "=== [3/5] Stage 1: pionc0 -> pionc1 ==="
              mkdir -p "$TMP_DIR/cas_s1"
              PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s1" "$OUT_DIR/pionc0" build \
                --emit-ssa "$OUT_DIR/stage1.ssa" \
                --emit-asm "$OUT_DIR/stage1.s" \
                -o "$OUT_DIR/pionc1" \
                "$COMPILER_DIR/src/core" \
                "$COMPILER_DIR/src/cli/main.pion"

              echo "=== [4/5] Stage 2: pionc1 -> pionc2 ==="
              mkdir -p "$TMP_DIR/cas_s2"
              PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s2" "$OUT_DIR/pionc1" build \
                --emit-ssa "$OUT_DIR/stage2.ssa" \
                --emit-asm "$OUT_DIR/stage2.s" \
                -o "$OUT_DIR/pionc2" \
                "$COMPILER_DIR/src/core" \
                "$COMPILER_DIR/src/cli/main.pion"

              echo "=== [5/5] Fixed-point proof ==="
              if cmp -s "$OUT_DIR/stage1.ssa" "$OUT_DIR/stage2.ssa"; then
                cmp "$OUT_DIR/stage1.s" "$OUT_DIR/stage2.s"
                echo "Fixed-point (Stage 1 == Stage 2): BIT-FOR-BIT IDENTICAL"
              else
                mkdir -p "$TMP_DIR/cas_s3"
                PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s3" "$OUT_DIR/pionc2" build \
                  --emit-ssa "$OUT_DIR/stage3.ssa" \
                  --emit-asm "$OUT_DIR/stage3.s" \
                  -o "$OUT_DIR/pionc3" \
                  "$COMPILER_DIR/src/core" \
                  "$COMPILER_DIR/src/cli/main.pion"
                cmp "$OUT_DIR/stage2.ssa" "$OUT_DIR/stage3.ssa"
                cmp "$OUT_DIR/stage2.s" "$OUT_DIR/stage3.s"
                echo "Fixed-point (Stage 2 == Stage 3): BIT-FOR-BIT IDENTICAL"
              fi
            ) > "${{ runner.temp }}/ci-logs/bootstrap.log" 2>&1 &
            PID_BOOT=$!
          fi

          FAIL=0
          wait "$PID_APT" || { echo "::error::Linux apt dependency install failed"; FAIL=1; }
          if [ -n "$PID_BOOT" ]; then
            wait "$PID_BOOT" || { echo "::error::Bootstrap pionc2 failed"; FAIL=1; }
          fi
          echo "=== Linux apt dependencies ==="
          cat "${{ runner.temp }}/ci-logs/apt.log"
          if [ -f "${{ runner.temp }}/ci-logs/bootstrap.log" ]; then
            echo "=== Bootstrap pionc2 ==="
            cat "${{ runner.temp }}/ci-logs/bootstrap.log"
          fi
          exit "$FAIL"

      - name: Save Linux apt .deb cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apt-debs
          key: linux-apt-debs-v2-${{ steps.job-meta.outputs.os_fp }}-gtk4-soup3-epoxy-mesa-ffmpeg

      - name: Save pion toolchain cache
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
            .pion/runtime/pion_wasm_rt.mjs
          key: pion-v3-linux-x86_64-${{ env.PION_SHA }}

      - name: Configure pion toolchain env
        id: pion-env
        env:
          CAS_HASH: ${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/.pion/release" ]; then
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion/release"
            PION_ID="${PION_RELEASE_SHA256}"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion"
            PION_ID="${PION_SHA}"
          fi
          PIONC_BIN="$(find "$SEARCH_ROOT" -type f \( -name pionc2 -o -name pionc \) | head -n 1)"
          QBE_BIN="$(find "$SEARCH_ROOT" -type f -name qbe | head -n 1)"
          RT_LIB="$(find "$SEARCH_ROOT" -type f -name libpionrt.a | head -n 1)"
          WASM_RT="$(find "$SEARCH_ROOT" -type f -name pion_wasm_rt.mjs | head -n 1)"
          test -n "$PIONC_BIN" && chmod +x "$PIONC_BIN"
          test -n "$QBE_BIN" && chmod +x "$QBE_BIN"
          mkdir -p "${{ runner.temp }}/pion-cas" "${{ runner.temp }}/ci-json"
          echo "$(dirname "$PIONC_BIN")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC_BIN" >> "$GITHUB_ENV"
          echo "PION_QBE=$QBE_BIN" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$RT_LIB" >> "$GITHUB_ENV"
          echo "PION_CACHE_DIR=${{ runner.temp }}/pion-cas" >> "$GITHUB_ENV"
          echo "PION_CACHE_MAX_MB=1024" >> "$GITHUB_ENV"
          echo "CI_JSON_DIR=${{ runner.temp }}/ci-json" >> "$GITHUB_ENV"
          if [ -n "$WASM_RT" ]; then
            echo "PION_WASM_RT=$WASM_RT" >> "$GITHUB_ENV"
          fi
          CC_FP=$(cc --version 2>&1 | head -n 1 | tr -cs 'A-Za-z0-9._' '-' | cut -c1-36)
          echo "env_fp=${ImageOS:-linux}-${CC_FP}" >> "$GITHUB_OUTPUT"
          echo "pion_id=${PION_ID}" >> "$GITHUB_OUTPUT"
          # Saved CAS keys end in the run, so a save the timeout cuts off can never hold a key a later run needs.
          CAS_PREFIX="pion-cas-v3-linux-x86_64-${ImageOS:-linux}-${CC_FP}-${PION_ID}"
          echo "cas_prefix=${CAS_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "cas_base=${CAS_PREFIX}-${CAS_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore pion CAS cache
        id: cas-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: ${{ steps.pion-env.outputs.cas_base }}-full
          restore-keys: |
            ${{ steps.pion-env.outputs.cas_base }}-full-
            ${{ steps.pion-env.outputs.cas_base }}-ws-
            ${{ steps.pion-env.outputs.cas_base }}
            ${{ steps.pion-env.outputs.cas_prefix }}-

      - name: Doctor, static audit, workspace type-check, reactive audit, web check & Web/Java checks (parallel)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ci-logs" target

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "web-java ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            mkdir -p target/raw_premul_java target/frame_pacer_java
            PIDS=()
            node scripts/check-web-shaders.mjs & PIDS+=($!)
            node scripts/test-a11y-bridge.mjs & PIDS+=($!)
            node scripts/test-host-ime.mjs & PIDS+=($!)
            node scripts/test-host-web-perf.mjs & PIDS+=($!)
            node scripts/test-host-raw-premul.mjs & PIDS+=($!)
            node scripts/test-host-shader-prewarm.mjs & PIDS+=($!)
            (
              set -euo pipefail
              javac -d target/raw_premul_java android/app/src/main/java/dev/invar/RawPremul.java android/mail/RawPremulTest.java
              java -cp target/raw_premul_java dev.invar.RawPremulTest
            ) & PIDS+=($!)
            (
              set -euo pipefail
              javac -d target/frame_pacer_java android/app/src/main/java/dev/invar/FramePacer.java android/app/src/main/java/dev/invar/FrameScheduler.java android/app/src/main/java/dev/invar/RateVoter.java android/app/src/main/java/dev/invar/FrameTelemetry.java android/pacer/FramePacerTest.java android/pacer/FrameSchedulerPropertyTest.java
              java -cp target/frame_pacer_java dev.invar.FramePacerTest
              java -cp target/frame_pacer_java dev.invar.FrameSchedulerPropertyTest
            ) & PIDS+=($!)
            WJ_FAIL=0
            for p in "${PIDS[@]}"; do wait "$p" || WJ_FAIL=1; done
            exit "$WJ_FAIL"
          ) > "${{ runner.temp }}/ci-logs/web-java.log" 2>&1 &
          PID_WEB_JAVA=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "audit-gen ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            python3 scripts/invar doctor --json
            bash scripts/check-generated.sh
            python3 scripts/invar audit --json --require-reactive > "$CI_JSON_DIR/audit.json"
          ) > "${{ runner.temp }}/ci-logs/audit-gen.log" 2>&1 &
          PID_AUDIT=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "ws-check ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            python3 scripts/invar check --json > "$CI_JSON_DIR/ws_check.json"
          ) > "${{ runner.temp }}/ci-logs/ws-check.log" 2>&1 &
          PID_CHECK=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "reactive-audit ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            bash scripts/test-reactive-audit.sh
          ) > "${{ runner.temp }}/ci-logs/reactive-audit.log" 2>&1 &
          PID_REACTIVE=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "web-check ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            python3 scripts/invar web check --out-wasm "$CI_JSON_DIR/lg_web.wasm" --json > "$CI_JSON_DIR/web_check.json"
          ) > "${{ runner.temp }}/ci-logs/web-check.log" 2>&1 &
          PID_WEB_CHECK=$!

          FAIL=0
          wait "$PID_AUDIT" || {
            echo "::error::Doctor / check-generated / static audit failed"
            if [ -s "$CI_JSON_DIR/audit.json" ]; then
              echo "=== audit.json ==="
              cat "$CI_JSON_DIR/audit.json"
            fi
            FAIL=1
          }
          wait "$PID_CHECK" || {
            echo "::error::Workspace type-check failed"
            if [ -s "$CI_JSON_DIR/ws_check.json" ]; then
              echo "=== ws_check.json ==="
              cat "$CI_JSON_DIR/ws_check.json"
            fi
            FAIL=1
          }
          wait "$PID_REACTIVE" || { echo "::error::Reactive audit tests failed"; FAIL=1; }
          wait "$PID_WEB_CHECK" || {
            echo "::error::Web check (lg_web) failed"
            if [ -s "$CI_JSON_DIR/web_check.json" ]; then
              echo "=== web_check.json ==="
              cat "$CI_JSON_DIR/web_check.json"
            fi
            FAIL=1
          }
          wait "$PID_WEB_JAVA" || { echo "::error::Web/Java checks failed"; FAIL=1; }

          echo "=== Doctor, check-generated & static audit ==="
          cat "${{ runner.temp }}/ci-logs/audit-gen.log"
          echo "=== Workspace type-check ==="
          cat "${{ runner.temp }}/ci-logs/ws-check.log"
          echo "=== Reactive audit tests ==="
          cat "${{ runner.temp }}/ci-logs/reactive-audit.log"
          echo "=== Web check (lg_web) ==="
          cat "${{ runner.temp }}/ci-logs/web-check.log"
          echo "=== Web & Java checks ==="
          cat "${{ runner.temp }}/ci-logs/web-java.log"
          exit "$FAIL"

      - name: Run unit tests (manifest-discovered, including host & film)
        run: |
          set -euo pipefail
          python3 scripts/invar test --json | tee "$CI_JSON_DIR/ws_test.json"

      - name: Save pion CAS cache (workspace checkpoint)
        if: ${{ !startsWith(steps.cas-cache.outputs.cache-matched-key, format('{0}-', steps.pion-env.outputs.cas_base)) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: ${{ steps.pion-env.outputs.cas_base }}-ws-${{ github.run_id }}-${{ github.run_attempt }}

      - name: WebAssembly showcase, invar CLI E2E, MT stress & Linux host (parallel)
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            SECONDS=0; trap 'echo "mt-stress ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            RUNS=3 bash examples/worker_app/scripts/verify-mt.sh
          ) > "${{ runner.temp }}/ci-logs/mt-stress.log" 2>&1 &
          PID_MT=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "linux-host ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            bash scripts/check-linux-host.sh --skip-workspace-pion-tests
          ) > "${{ runner.temp }}/ci-logs/linux-host.log" 2>&1 &
          PID_HOST=$!

          (
            set -euo pipefail
            SECONDS=0; trap 'echo "cli-e2e ${SECONDS}s rc=$?" >> "$RUNNER_TEMP/timings.txt"' EXIT
            INVAR_CLI_TEST_AUDIT_JSON="$CI_JSON_DIR/audit.json" \
            INVAR_CLI_TEST_WS_CHECK_JSON="$CI_JSON_DIR/ws_check.json" \
            INVAR_CLI_TEST_WS_TEST_JSON="$CI_JSON_DIR/ws_test.json" \
            INVAR_CLI_TEST_WEB_CHECK_JSON="$CI_JSON_DIR/web_check.json" \
            INVAR_CLI_TEST_LG_WASM="$CI_JSON_DIR/lg_web.wasm" \
              bash scripts/test-invar-cli.sh
          ) &
          PID_CLI=$!

          FAIL=0
          wait "$PID_CLI" || { echo "::error::invar CLI E2E (incl. web check) failed"; FAIL=1; }
          wait "$PID_MT" || { echo "::error::MT stress failed"; FAIL=1; }
          wait "$PID_HOST" || { echo "::error::Linux host check failed"; FAIL=1; }
          echo "=== MT stress ==="
          cat "${{ runner.temp }}/ci-logs/mt-stress.log"
          echo "=== Linux host check ==="
          cat "${{ runner.temp }}/ci-logs/linux-host.log"
          exit "$FAIL"

      - name: Save pion CAS cache
        if: ${{ !startsWith(steps.cas-cache.outputs.cache-matched-key, format('{0}-full-', steps.pion-env.outputs.cas_base)) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: ${{ steps.pion-env.outputs.cas_base }}-full-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Timing report
        if: always()
        run: python3 scripts/ci-timing-report.py

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-x86_64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-x86_64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi
