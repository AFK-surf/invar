name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PION_SHA: fdca4e0c9e2e444111417b77e3d15803a959e10e

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 3
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_MACOS }}
      PION_RELEASE_SHA256: ${{ vars.PION_RELEASE_SHA256_MACOS }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout invar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download prebuilt pion toolchain (optional)
        if: env.PION_RELEASE_URL != ''
        run: |
          if [ -z "$PION_RELEASE_SHA256" ]; then
            echo "PION_RELEASE_SHA256_MACOS must be set when PION_RELEASE_URL_MACOS is configured" >&2
            exit 1
          fi
          mkdir -p .pion/release
          curl -fsSL "$PION_RELEASE_URL" -o .pion/release/pion.tar.gz
          echo "${PION_RELEASE_SHA256}  .pion/release/pion.tar.gz" | shasum -a 256 -c -
          tar -xzf .pion/release/pion.tar.gz -C .pion/release
          rm -f .pion/release/pion.tar.gz

      - name: Restore pion toolchain cache (pionc2, qbe, libpionrt.a, pion_wasm_rt.mjs)
        if: env.PION_RELEASE_URL == ''
        id: pion-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
            .pion/runtime/pion_wasm_rt.mjs
          key: pion-v3-macos-arm64-${{ env.PION_SHA }}

      - name: Checkout pion
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AFK-surf/pion
          ref: ${{ env.PION_SHA }}
          path: .pion
          persist-credentials: false

      - name: Bootstrap pionc2 (Stage 0 -> Stage 2 fixed-point)
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          OUT_DIR="$PWD/.pion/out"
          COMPILER_DIR="$PWD/.pion/compiler"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          export PION_QBE="$OUT_DIR/qbe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"

          echo "=== [1/5] Build QBE + libpionrt.a + libpionrt_cli.a ==="
          sh .pion/scripts/build-qbe.sh "$PION_QBE"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c .pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c .pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"

          echo "=== [2/5] Stage 0: Seed -> pionc0 (arm64_apple --obj) ==="
          gzip -dc .pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/pionc-seed.ssa"
          "$PION_QBE" -t arm64_apple --obj -o "$TMP_DIR/pionc0.o" "$TMP_DIR/pionc-seed.ssa"
          cc "$TMP_DIR/pionc0.o" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"

          echo "=== [3/5] Stage 1: pionc0 -> pionc1 ==="
          mkdir -p "$TMP_DIR/cas_s1"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s1" "$OUT_DIR/pionc0" build \
            --emit-ssa "$OUT_DIR/stage1.ssa" \
            --emit-asm "$OUT_DIR/stage1.s" \
            -o "$OUT_DIR/pionc1" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"

          echo "=== [4/5] Stage 2: pionc1 -> pionc2 ==="
          mkdir -p "$TMP_DIR/cas_s2"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s2" "$OUT_DIR/pionc1" build \
            --emit-ssa "$OUT_DIR/stage2.ssa" \
            --emit-asm "$OUT_DIR/stage2.s" \
            -o "$OUT_DIR/pionc2" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"

          echo "=== [5/5] Fixed-point proof ==="
          if cmp -s "$OUT_DIR/stage1.ssa" "$OUT_DIR/stage2.ssa"; then
            cmp "$OUT_DIR/stage1.s" "$OUT_DIR/stage2.s"
            echo "Fixed-point (Stage 1 == Stage 2): BIT-FOR-BIT IDENTICAL"
          else
            mkdir -p "$TMP_DIR/cas_s3"
            PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s3" "$OUT_DIR/pionc2" build \
              --emit-ssa "$OUT_DIR/stage3.ssa" \
              --emit-asm "$OUT_DIR/stage3.s" \
              -o "$OUT_DIR/pionc3" \
              "$COMPILER_DIR/src/core" \
              "$COMPILER_DIR/src/cli/main.pion"
            cmp "$OUT_DIR/stage2.ssa" "$OUT_DIR/stage3.ssa"
            cmp "$OUT_DIR/stage2.s" "$OUT_DIR/stage3.s"
            echo "Fixed-point (Stage 2 == Stage 3): BIT-FOR-BIT IDENTICAL"
          fi

      - name: Save pion toolchain cache
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
            .pion/runtime/pion_wasm_rt.mjs
          key: pion-v3-macos-arm64-${{ env.PION_SHA }}

      - name: Configure pion toolchain env
        id: pion-env
        run: |
          if [ -d "$GITHUB_WORKSPACE/.pion/release" ]; then
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion/release"
            PION_ID="${PION_RELEASE_SHA256}"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion"
            PION_ID="${PION_SHA}"
          fi
          PIONC_BIN="$(find "$SEARCH_ROOT" -type f \( -name pionc2 -o -name pionc \) | head -n 1)"
          QBE_BIN="$(find "$SEARCH_ROOT" -type f -name qbe | head -n 1)"
          RT_LIB="$(find "$SEARCH_ROOT" -type f -name libpionrt.a | head -n 1)"
          WASM_RT="$(find "$SEARCH_ROOT" -type f -name pion_wasm_rt.mjs | head -n 1)"
          test -n "$PIONC_BIN" && chmod +x "$PIONC_BIN"
          test -n "$QBE_BIN" && chmod +x "$QBE_BIN"
          mkdir -p "${{ runner.temp }}/pion-cas" "${{ runner.temp }}/ci-json"
          echo "$(dirname "$PIONC_BIN")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC_BIN" >> "$GITHUB_ENV"
          echo "PION_QBE=$QBE_BIN" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$RT_LIB" >> "$GITHUB_ENV"
          echo "PION_CACHE_DIR=${{ runner.temp }}/pion-cas" >> "$GITHUB_ENV"
          echo "PION_CACHE_MAX_MB=1024" >> "$GITHUB_ENV"
          echo "CI_JSON_DIR=${{ runner.temp }}/ci-json" >> "$GITHUB_ENV"
          if [ -n "$WASM_RT" ]; then
            echo "PION_WASM_RT=$WASM_RT" >> "$GITHUB_ENV"
          fi
          CC_FP=$(cc --version 2>&1 | head -n 1 | tr -cs 'A-Za-z0-9._' '-' | cut -c1-36)
          echo "env_fp=${ImageOS:-macos}-${CC_FP}" >> "$GITHUB_OUTPUT"
          echo "pion_id=${PION_ID}" >> "$GITHUB_OUTPUT"

      - name: Restore pion CAS cache
        id: cas-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-${{ steps.pion-env.outputs.pion_id }}-${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}
          restore-keys: |
            pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-${{ steps.pion-env.outputs.pion_id }}-
            pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-

      - name: Doctor, static audit, workspace type-check, reactive audit & Web/Java/iOS/Apple native checks (parallel)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ci-logs" target

          (
            set -euo pipefail
            mkdir -p target/raw_premul_java target/frame_pacer_java
            node scripts/check-web-shaders.mjs
            node scripts/test-a11y-bridge.mjs
            node scripts/test-host-ime.mjs
            node scripts/test-host-web-perf.mjs
            node scripts/test-host-raw-premul.mjs
            node scripts/test-host-shader-prewarm.mjs
            javac -d target/raw_premul_java android/app/src/main/java/dev/invar/RawPremul.java android/mail/RawPremulTest.java
            java -cp target/raw_premul_java dev.invar.RawPremulTest
            javac -d target/frame_pacer_java android/app/src/main/java/dev/invar/FramePacer.java android/app/src/main/java/dev/invar/FrameScheduler.java android/app/src/main/java/dev/invar/RateVoter.java android/app/src/main/java/dev/invar/FrameTelemetry.java android/pacer/FramePacerTest.java android/pacer/FrameSchedulerPropertyTest.java
            java -cp target/frame_pacer_java dev.invar.FramePacerTest
            java -cp target/frame_pacer_java dev.invar.FrameSchedulerPropertyTest
          ) > "${{ runner.temp }}/ci-logs/web-java.log" 2>&1 &
          PID_WEB_JAVA=$!

          (
            set -euo pipefail
            INVAR_IOS_CC_JOBS=2 bash scripts/check-ios-host.sh
            cc -Wall -Werror -fobjc-arc packages/host/tests/apple_grab_nav_test.m \
              -framework Foundation -framework CoreGraphics -framework CoreVideo -framework ImageIO \
              -o target/apple_grab_nav_test
            cc -Wall -Werror -fobjc-arc -Ipackages/host/compat -Ipackages/host/native packages/host/tests/apple_text_test.m \
              -framework Foundation -framework AppKit -framework CoreText -framework CoreGraphics -framework ImageIO \
              -o target/apple_text_test
            cc -Wall -Wextra -Werror -O2 -Ipackages/host/native packages/host/tests/raw_premul_test.c \
              -lm -o target/raw_premul_test
            target/apple_grab_nav_test
            target/apple_text_test
            target/raw_premul_test
          ) > "${{ runner.temp }}/ci-logs/apple-native.log" 2>&1 &
          PID_APPLE=$!

          (
            set -euo pipefail
            python3 scripts/invar doctor --json
            python3 scripts/invar audit --json --require-reactive | tee "$CI_JSON_DIR/audit.json"
            bash scripts/check-generated.sh
            python3 scripts/invar check --json | tee "$CI_JSON_DIR/ws_check.json"
            bash scripts/test-reactive-audit.sh
          ) &
          PID_AUDIT=$!

          FAIL=0
          wait "$PID_AUDIT" || { echo "::error::Doctor / static audit / workspace type-check / reactive audit failed"; FAIL=1; }
          wait "$PID_WEB_JAVA" || { echo "::error::Web/Java checks failed"; FAIL=1; }
          wait "$PID_APPLE" || { echo "::error::iOS/Apple native checks failed"; FAIL=1; }

          echo "=== Web & Java checks ==="
          cat "${{ runner.temp }}/ci-logs/web-java.log"
          echo "=== iOS & Apple native checks ==="
          cat "${{ runner.temp }}/ci-logs/apple-native.log"
          exit "$FAIL"

      - name: Run unit tests (manifest-discovered, including host & film)
        run: |
          set -euo pipefail
          python3 scripts/invar test --json | tee "$CI_JSON_DIR/ws_test.json"

      - name: Save pion CAS cache (workspace checkpoint)
        if: steps.cas-cache.outputs.cache-hit != 'true' && !contains(steps.cas-cache.outputs.cache-matched-key, '-ws')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-${{ steps.pion-env.outputs.pion_id }}-${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}-ws

      - name: invar CLI E2E, MT stress & JSX example (parallel)
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            RUNS=3 bash examples/worker_app/scripts/verify-mt.sh
            "$PIONC" build -o /tmp/jsx_app examples/jsx_app
            rm -f /tmp/jsx_app
          ) > "${{ runner.temp }}/ci-logs/aux-checks.log" 2>&1 &
          PID_AUX=$!

          CLI_RC=0
          INVAR_CLI_TEST_AUDIT_JSON="$CI_JSON_DIR/audit.json" \
          INVAR_CLI_TEST_WS_CHECK_JSON="$CI_JSON_DIR/ws_check.json" \
          INVAR_CLI_TEST_WS_TEST_JSON="$CI_JSON_DIR/ws_test.json" \
            bash scripts/test-invar-cli.sh || CLI_RC=$?

          FAIL=0
          if [ "$CLI_RC" -ne 0 ]; then
            echo "::error::invar CLI E2E tests failed (rc=$CLI_RC)"
            FAIL=1
          fi
          wait "$PID_AUX" || { echo "::error::MT stress / JSX example failed"; FAIL=1; }
          echo "=== MT stress & JSX example ==="
          cat "${{ runner.temp }}/ci-logs/aux-checks.log"
          exit "$FAIL"

      - name: Save pion CAS cache
        if: steps.cas-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-${{ steps.pion-env.outputs.pion_id }}-${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job macos-arm64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::macos-arm64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_LINUX }}
      PION_RELEASE_SHA256: ${{ vars.PION_RELEASE_SHA256_LINUX }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout invar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux toolchain, dependencies & pion CAS
        id: setup
        uses: ./.github/actions/linux-setup

      - name: Doctor, static audit, workspace type-check, reactive audit & Web/Java checks (parallel)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ci-logs" target

          (
            set -euo pipefail
            mkdir -p target/raw_premul_java target/frame_pacer_java
            PIDS=()
            node scripts/check-web-shaders.mjs & PIDS+=($!)
            node scripts/test-a11y-bridge.mjs & PIDS+=($!)
            node scripts/test-host-ime.mjs & PIDS+=($!)
            node scripts/test-host-web-perf.mjs & PIDS+=($!)
            node scripts/test-host-raw-premul.mjs & PIDS+=($!)
            node scripts/test-host-shader-prewarm.mjs & PIDS+=($!)
            (
              javac -d target/raw_premul_java android/app/src/main/java/dev/invar/RawPremul.java android/mail/RawPremulTest.java
              java -cp target/raw_premul_java dev.invar.RawPremulTest
            ) & PIDS+=($!)
            (
              javac -d target/frame_pacer_java android/app/src/main/java/dev/invar/FramePacer.java android/app/src/main/java/dev/invar/FrameScheduler.java android/app/src/main/java/dev/invar/RateVoter.java android/app/src/main/java/dev/invar/FrameTelemetry.java android/pacer/FramePacerTest.java android/pacer/FrameSchedulerPropertyTest.java
              java -cp target/frame_pacer_java dev.invar.FramePacerTest
              java -cp target/frame_pacer_java dev.invar.FrameSchedulerPropertyTest
            ) & PIDS+=($!)
            WJ_FAIL=0
            for p in "${PIDS[@]}"; do wait "$p" || WJ_FAIL=1; done
            exit "$WJ_FAIL"
          ) > "${{ runner.temp }}/ci-logs/web-java.log" 2>&1 &
          PID_WEB_JAVA=$!

          (
            set -euo pipefail
            python3 scripts/invar doctor --json
            python3 scripts/invar audit --json --require-reactive | tee "$CI_JSON_DIR/audit.json"
            bash scripts/check-generated.sh
            python3 scripts/invar check --json | tee "$CI_JSON_DIR/ws_check.json"
            bash scripts/test-reactive-audit.sh
          ) &
          PID_AUDIT=$!

          FAIL=0
          wait "$PID_AUDIT" || { echo "::error::Doctor / static audit / workspace type-check / reactive audit failed"; FAIL=1; }
          wait "$PID_WEB_JAVA" || { echo "::error::Web/Java checks failed"; FAIL=1; }

          echo "=== Web & Java checks ==="
          cat "${{ runner.temp }}/ci-logs/web-java.log"
          exit "$FAIL"

      - name: Run unit tests (manifest-discovered, including host & film)
        run: |
          set -euo pipefail
          python3 scripts/invar test --json | tee "$CI_JSON_DIR/ws_test.json"

      - name: Workspace audit / check / test results for the CLI E2E job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ci-json
          path: ${{ runner.temp }}/ci-json/*.json
          retention-days: 1
          if-no-files-found: error

      - name: Save pion CAS cache (workspace checkpoint)
        if: steps.setup.outputs.cas_hit != 'true' && !contains(steps.setup.outputs.cas_matched_key, '-ws')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-v3-linux-x86_64-${{ steps.setup.outputs.env_fp }}-${{ steps.setup.outputs.pion_id }}-${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}-ws

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-x86_64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-x86_64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-x86_64-host:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_LINUX }}
      PION_RELEASE_SHA256: ${{ vars.PION_RELEASE_SHA256_LINUX }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout invar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux toolchain, dependencies & pion CAS
        id: setup
        uses: ./.github/actions/linux-setup

      # (apart from the unit tests' job: each job of the three stays inside its three minutes)
      - name: MT stress & Linux host (parallel)
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ci-logs"
          (
            set -euo pipefail
            RUNS=3 bash examples/worker_app/scripts/verify-mt.sh
          ) > "${{ runner.temp }}/ci-logs/mt-stress.log" 2>&1 &
          PID_MT=$!

          (
            set -euo pipefail
            bash scripts/check-linux-host.sh --skip-workspace-pion-tests
          ) > "${{ runner.temp }}/ci-logs/linux-host.log" 2>&1 &
          PID_HOST=$!

          FAIL=0
          wait "$PID_MT" || { echo "::error::MT stress failed"; FAIL=1; }
          wait "$PID_HOST" || { echo "::error::Linux host check failed"; FAIL=1; }
          echo "=== MT stress ==="
          cat "${{ runner.temp }}/ci-logs/mt-stress.log"
          echo "=== Linux host check ==="
          cat "${{ runner.temp }}/ci-logs/linux-host.log"
          exit "$FAIL"

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-x86_64-host duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-x86_64-host took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-x86_64-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # (the workspace audit / check / test it checks are the first job's: taken, not run again)
    needs: linux-x86_64
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_LINUX }}
      PION_RELEASE_SHA256: ${{ vars.PION_RELEASE_SHA256_LINUX }}
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout invar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux toolchain, dependencies & pion CAS
        id: setup
        uses: ./.github/actions/linux-setup

      - name: Workspace audit / check / test results of the first job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-ci-json
          path: ${{ runner.temp }}/ci-json

      - name: WebAssembly showcase & invar CLI E2E
        run: |
          set -euo pipefail
          INVAR_CLI_TEST_AUDIT_JSON="$CI_JSON_DIR/audit.json" \
          INVAR_CLI_TEST_WS_CHECK_JSON="$CI_JSON_DIR/ws_check.json" \
          INVAR_CLI_TEST_WS_TEST_JSON="$CI_JSON_DIR/ws_test.json" \
            bash scripts/test-invar-cli.sh

      - name: Save pion CAS cache
        if: steps.setup.outputs.cas_hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
