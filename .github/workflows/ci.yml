name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_MACOS }}
    steps:
      - name: Checkout invar
        uses: actions/checkout@v4

      - name: Download prebuilt pion toolchain (optional)
        if: env.PION_RELEASE_URL != ''
        run: |
          mkdir -p .pion/release
          curl -fsSL "$PION_RELEASE_URL" | tar -xz -C .pion/release

      - name: Checkout pion
        if: env.PION_RELEASE_URL == ''
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          path: .pion
          token: ${{ secrets.PION_REPO_TOKEN || github.token }}

      - name: Resolve pion commit SHA
        if: env.PION_RELEASE_URL == ''
        id: pion-sha
        run: echo "sha=$(git -C .pion rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache pion toolchain (pionc2, qbe, libpionrt.a)
        if: env.PION_RELEASE_URL == ''
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
          key: pion-macos-arm64-${{ steps.pion-sha.outputs.sha }}

      - name: Bootstrap pionc2
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        run: sh .pion/scripts/bootstrap.sh

      - name: Configure pion toolchain env
        run: |
          if [ -d "$GITHUB_WORKSPACE/.pion/release" ]; then
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion/release"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion"
          fi
          PIONC_BIN="$(find "$SEARCH_ROOT" -type f \( -name pionc2 -o -name pionc \) | head -n 1)"
          QBE_BIN="$(find "$SEARCH_ROOT" -type f -name qbe | head -n 1)"
          RT_LIB="$(find "$SEARCH_ROOT" -type f -name libpionrt.a | head -n 1)"
          WASM_RT="$(find "$SEARCH_ROOT" -type f -name pion_wasm_rt.mjs | head -n 1)"
          test -n "$PIONC_BIN" && chmod +x "$PIONC_BIN"
          test -n "$QBE_BIN" && chmod +x "$QBE_BIN"
          echo "$(dirname "$PIONC_BIN")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC_BIN" >> "$GITHUB_ENV"
          echo "PION_QBE=$QBE_BIN" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$RT_LIB" >> "$GITHUB_ENV"
          if [ -n "$WASM_RT" ]; then
            echo "PION_WASM_RT=$WASM_RT" >> "$GITHUB_ENV"
          fi

      - name: Doctor & static audit
        run: |
          python3 scripts/invar doctor --json
          python3 scripts/invar audit --json

      - name: Format & type-check workspace (including examples/jsx_app)
        run: python3 scripts/invar check --json

      - name: Run unit tests (core layers, hostapi, kit, ui, lg, examples)
        run: python3 scripts/invar test --json

      - name: Build native macOS JSX example binary
        run: |
          "$PIONC" build -o /tmp/jsx_app examples/jsx_app
          rm -f /tmp/jsx_app

      - name: Check iOS Metal host build & exported symbols
        run: bash scripts/check-ios-host.sh

  linux-x86_64:
    runs-on: ubuntu-latest
    env:
      PION_RELEASE_URL: ${{ vars.PION_RELEASE_URL_LINUX }}
    steps:
      - name: Checkout invar
        uses: actions/checkout@v4

      - name: Install Linux GTK4 / EGL / GLES3 / Pango / libsoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libepoxy-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libgdk-pixbuf-2.0-dev \
            zlib1g-dev \
            pkg-config \
            mesa-utils \
            libgl1-mesa-dri

      - name: Download prebuilt pion toolchain (optional)
        if: env.PION_RELEASE_URL != ''
        run: |
          mkdir -p .pion/release
          curl -fsSL "$PION_RELEASE_URL" | tar -xz -C .pion/release

      - name: Checkout pion
        if: env.PION_RELEASE_URL == ''
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          path: .pion
          token: ${{ secrets.PION_REPO_TOKEN || github.token }}

      - name: Resolve pion commit SHA
        if: env.PION_RELEASE_URL == ''
        id: pion-sha
        run: echo "sha=$(git -C .pion rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache pion toolchain (pionc2, qbe, libpionrt.a)
        if: env.PION_RELEASE_URL == ''
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
          key: pion-linux-x86_64-${{ steps.pion-sha.outputs.sha }}

      - name: Bootstrap pionc2
        if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
        run: sh .pion/scripts/bootstrap.sh

      - name: Configure pion toolchain env
        run: |
          if [ -d "$GITHUB_WORKSPACE/.pion/release" ]; then
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion/release"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE/.pion"
          fi
          PIONC_BIN="$(find "$SEARCH_ROOT" -type f \( -name pionc2 -o -name pionc \) | head -n 1)"
          QBE_BIN="$(find "$SEARCH_ROOT" -type f -name qbe | head -n 1)"
          RT_LIB="$(find "$SEARCH_ROOT" -type f -name libpionrt.a | head -n 1)"
          WASM_RT="$(find "$SEARCH_ROOT" -type f -name pion_wasm_rt.mjs | head -n 1)"
          test -n "$PIONC_BIN" && chmod +x "$PIONC_BIN"
          test -n "$QBE_BIN" && chmod +x "$QBE_BIN"
          echo "$(dirname "$PIONC_BIN")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC_BIN" >> "$GITHUB_ENV"
          echo "PION_QBE=$QBE_BIN" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$RT_LIB" >> "$GITHUB_ENV"
          if [ -n "$WASM_RT" ]; then
            echo "PION_WASM_RT=$WASM_RT" >> "$GITHUB_ENV"
          fi

      - name: Doctor & static audit
        run: |
          python3 scripts/invar doctor --json
          python3 scripts/invar audit --json

      - name: Format & type-check workspace (including examples/jsx_app)
        run: python3 scripts/invar check --json

      - name: Run unit tests (core layers, hostapi, kit, ui, lg, examples)
        run: python3 scripts/invar test --json

      - name: Check WebAssembly showcase & JS host bridge (lg_web wasm32)
        run: python3 scripts/invar web check --json

      - name: Check Linux EGL/GLES3 host & llvmpipe tests
        run: bash scripts/check-linux-host.sh
