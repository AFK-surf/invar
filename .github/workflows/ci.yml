name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout invar
        uses: actions/checkout@v4

      - name: Checkout pion
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          path: .pion
          token: ${{ secrets.PION_REPO_TOKEN || github.token }}

      - name: Resolve pion commit SHA
        id: pion-sha
        run: echo "sha=$(git -C .pion rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache pion toolchain (pionc2, qbe, libpionrt.a)
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
          key: pion-macos-arm64-${{ steps.pion-sha.outputs.sha }}

      - name: Bootstrap pionc2
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: sh .pion/scripts/bootstrap.sh

      - name: Configure pion toolchain env
        run: |
          PION_OUT="$GITHUB_WORKSPACE/.pion/out"
          echo "PIONC=$PION_OUT/pionc2" >> "$GITHUB_ENV"
          echo "PION_QBE=$PION_OUT/qbe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$PION_OUT/libpionrt.a" >> "$GITHUB_ENV"
          echo "PION_WASM_RT=$GITHUB_WORKSPACE/.pion/runtime/pion_wasm_rt.mjs" >> "$GITHUB_ENV"

      - name: Type-check host and Liquid Glass packages
        run: |
          "$PIONC" check packages/host
          "$PIONC" check packages/lg
          "$PIONC" check packages/lg_pages
          "$PIONC" check packages/lg_shots
          "$PIONC" check packages/lg_web

      - name: Run unit tests (core layers + lg + bench + site)
        run: |
          for pkg in layer0_check layer1a_check layer1b_check view damage headless ui lg bench site; do
            echo "==> pionc2 test packages/$pkg"
            "$PIONC" test "packages/$pkg"
          done

      - name: Check iOS Metal host build & exported symbols
        run: bash scripts/check-ios-host.sh

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout invar
        uses: actions/checkout@v4

      - name: Checkout pion
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          path: .pion
          token: ${{ secrets.PION_REPO_TOKEN || github.token }}

      - name: Install Linux GTK4 / EGL / GLES3 / Pango / libsoup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libepoxy-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libgdk-pixbuf-2.0-dev \
            zlib1g-dev \
            pkg-config \
            mesa-utils \
            libgl1-mesa-dri

      - name: Resolve pion commit SHA
        id: pion-sha
        run: echo "sha=$(git -C .pion rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache pion toolchain (pionc2, qbe, libpionrt.a)
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
          key: pion-linux-x86_64-${{ steps.pion-sha.outputs.sha }}

      - name: Bootstrap pionc2
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: sh .pion/scripts/bootstrap.sh

      - name: Configure pion toolchain env
        run: |
          PION_OUT="$GITHUB_WORKSPACE/.pion/out"
          echo "PIONC=$PION_OUT/pionc2" >> "$GITHUB_ENV"
          echo "PION_QBE=$PION_OUT/qbe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=$PION_OUT/libpionrt.a" >> "$GITHUB_ENV"
          echo "PION_WASM_RT=$GITHUB_WORKSPACE/.pion/runtime/pion_wasm_rt.mjs" >> "$GITHUB_ENV"

      - name: Run unit tests (core pure-Pion packages)
        run: |
          for pkg in layer0_check layer1a_check layer1b_check view damage headless ui lg bench site; do
            echo "==> pionc2 test packages/$pkg"
            "$PIONC" test "packages/$pkg"
          done

      - name: Check Linux EGL/GLES3 host & llvmpipe tests
        run: bash scripts/check-linux-host.sh

      - name: Build WebAssembly showcase (lg_web wasm32)
        run: |
          "$PIONC" build --release --target wasm32 packages/lg_web
