name: macOS pion toolchain & CAS
description: >-
  What every macOS job of CI starts with: pionc2 from the toolchain cache (or bootstrapped from the seed at PION_SHA),
  PIONC / PION_QBE / PION_RT_LIB / PION_CACHE_DIR / CI_JSON_DIR set for the job, and the pion CAS restored.
outputs:
  env_fp:
    description: The runner image and C compiler, as the CAS key says them
    value: ${{ steps.pion-env.outputs.env_fp }}
  pion_id:
    description: The pion toolchain's id (PION_SHA, or the release's sha256)
    value: ${{ steps.pion-env.outputs.pion_id }}
  cas_hit:
    description: Whether the CAS was restored from its exact key
    value: ${{ steps.cas-cache.outputs.cache-hit }}
  cas_matched_key:
    description: The CAS key restored from
    value: ${{ steps.cas-cache.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
    - name: Download prebuilt pion toolchain (optional)
      if: env.PION_RELEASE_URL != ''
      shell: bash
      run: |
        if [ -z "$PION_RELEASE_SHA256" ]; then
          echo "PION_RELEASE_SHA256_MACOS must be set when PION_RELEASE_URL_MACOS is configured" >&2
          exit 1
        fi
        mkdir -p .pion/release
        curl -fsSL "$PION_RELEASE_URL" -o .pion/release/pion.tar.gz
        echo "${PION_RELEASE_SHA256}  .pion/release/pion.tar.gz" | shasum -a 256 -c -
        tar -xzf .pion/release/pion.tar.gz -C .pion/release
        rm -f .pion/release/pion.tar.gz

    - name: Restore pion toolchain cache (pionc2, qbe, libpionrt.a, pion_wasm_rt.mjs)
      if: env.PION_RELEASE_URL == ''
      id: pion-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .pion/out/pionc2
          .pion/out/qbe
          .pion/out/libpionrt.a
          .pion/runtime/pion_wasm_rt.mjs
        key: pion-v3-macos-arm64-${{ env.PION_SHA }}

    - name: Checkout pion
      if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: AFK-surf/pion
        ref: ${{ env.PION_SHA }}
        path: .pion
        persist-credentials: false

    - name: Bootstrap pionc2 (Stage 0 -> Stage 2 fixed-point)
      if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        OUT_DIR="$PWD/.pion/out"
        COMPILER_DIR="$PWD/.pion/compiler"
        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT
        mkdir -p "$OUT_DIR"
        export PION_QBE="$OUT_DIR/qbe"
        export PION_RT_LIB="$OUT_DIR/libpionrt.a"
        PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"

        echo "=== [1/5] Build QBE + libpionrt.a + libpionrt_cli.a ==="
        sh .pion/scripts/build-qbe.sh "$PION_QBE"
        cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
          -c .pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
        ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
        cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
          -c .pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
        ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"

        echo "=== [2/5] Stage 0: Seed -> pionc0 (arm64_apple --obj) ==="
        gzip -dc .pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/pionc-seed.ssa"
        "$PION_QBE" -t arm64_apple --obj -o "$TMP_DIR/pionc0.o" "$TMP_DIR/pionc-seed.ssa"
        cc "$TMP_DIR/pionc0.o" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"

        echo "=== [3/5] Stage 1: pionc0 -> pionc1 ==="
        mkdir -p "$TMP_DIR/cas_s1"
        PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s1" "$OUT_DIR/pionc0" build \
          --emit-ssa "$OUT_DIR/stage1.ssa" \
          --emit-asm "$OUT_DIR/stage1.s" \
          -o "$OUT_DIR/pionc1" \
          "$COMPILER_DIR/src/core" \
          "$COMPILER_DIR/src/cli/main.pion"

        echo "=== [4/5] Stage 2: pionc1 -> pionc2 ==="
        mkdir -p "$TMP_DIR/cas_s2"
        PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s2" "$OUT_DIR/pionc1" build \
          --emit-ssa "$OUT_DIR/stage2.ssa" \
          --emit-asm "$OUT_DIR/stage2.s" \
          -o "$OUT_DIR/pionc2" \
          "$COMPILER_DIR/src/core" \
          "$COMPILER_DIR/src/cli/main.pion"

        echo "=== [5/5] Fixed-point proof ==="
        if cmp -s "$OUT_DIR/stage1.ssa" "$OUT_DIR/stage2.ssa"; then
          cmp "$OUT_DIR/stage1.s" "$OUT_DIR/stage2.s"
          echo "Fixed-point (Stage 1 == Stage 2): BIT-FOR-BIT IDENTICAL"
        else
          mkdir -p "$TMP_DIR/cas_s3"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s3" "$OUT_DIR/pionc2" build \
            --emit-ssa "$OUT_DIR/stage3.ssa" \
            --emit-asm "$OUT_DIR/stage3.s" \
            -o "$OUT_DIR/pionc3" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"
          cmp "$OUT_DIR/stage2.ssa" "$OUT_DIR/stage3.ssa"
          cmp "$OUT_DIR/stage2.s" "$OUT_DIR/stage3.s"
          echo "Fixed-point (Stage 2 == Stage 3): BIT-FOR-BIT IDENTICAL"
        fi

    - name: Save pion toolchain cache
      if: env.PION_RELEASE_URL == '' && steps.pion-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .pion/out/pionc2
          .pion/out/qbe
          .pion/out/libpionrt.a
          .pion/runtime/pion_wasm_rt.mjs
        key: pion-v3-macos-arm64-${{ env.PION_SHA }}

    - name: Configure pion toolchain env
      id: pion-env
      shell: bash
      run: |
        if [ -d "$GITHUB_WORKSPACE/.pion/release" ]; then
          SEARCH_ROOT="$GITHUB_WORKSPACE/.pion/release"
          PION_ID="${PION_RELEASE_SHA256}"
        else
          SEARCH_ROOT="$GITHUB_WORKSPACE/.pion"
          PION_ID="${PION_SHA}"
        fi
        PIONC_BIN="$(find "$SEARCH_ROOT" -type f \( -name pionc2 -o -name pionc \) | head -n 1)"
        QBE_BIN="$(find "$SEARCH_ROOT" -type f -name qbe | head -n 1)"
        RT_LIB="$(find "$SEARCH_ROOT" -type f -name libpionrt.a | head -n 1)"
        WASM_RT="$(find "$SEARCH_ROOT" -type f -name pion_wasm_rt.mjs | head -n 1)"
        test -n "$PIONC_BIN" && chmod +x "$PIONC_BIN"
        test -n "$QBE_BIN" && chmod +x "$QBE_BIN"
        mkdir -p "${{ runner.temp }}/pion-cas" "${{ runner.temp }}/ci-json"
        echo "$(dirname "$PIONC_BIN")" >> "$GITHUB_PATH"
        echo "PIONC=$PIONC_BIN" >> "$GITHUB_ENV"
        echo "PION_QBE=$QBE_BIN" >> "$GITHUB_ENV"
        echo "PION_RT_LIB=$RT_LIB" >> "$GITHUB_ENV"
        echo "PION_CACHE_DIR=${{ runner.temp }}/pion-cas" >> "$GITHUB_ENV"
        echo "PION_CACHE_MAX_MB=1024" >> "$GITHUB_ENV"
        echo "CI_JSON_DIR=${{ runner.temp }}/ci-json" >> "$GITHUB_ENV"
        if [ -n "$WASM_RT" ]; then
          echo "PION_WASM_RT=$WASM_RT" >> "$GITHUB_ENV"
        fi
        CC_FP=$(cc --version 2>&1 | head -n 1 | tr -cs 'A-Za-z0-9._' '-' | cut -c1-36)
        echo "env_fp=${ImageOS:-macos}-${CC_FP}" >> "$GITHUB_OUTPUT"
        echo "pion_id=${PION_ID}" >> "$GITHUB_OUTPUT"

    - name: Restore pion CAS cache
      id: cas-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/pion-cas
        key: pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-${{ steps.pion-env.outputs.pion_id }}-${{ hashFiles('pion.toml', 'packages/**/pion.toml', 'examples/**/pion.toml', 'packages/**/*.c', 'packages/**/*.m', 'packages/**/*.h', 'packages/**/*.pion', 'examples/**/*.pion') }}
        restore-keys: |
          pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-${{ steps.pion-env.outputs.pion_id }}-
          pion-cas-v3-macos-arm64-${{ steps.pion-env.outputs.env_fp }}-
