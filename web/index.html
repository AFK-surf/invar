<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>ui.monoid · Liquid Glass Studio (Pion WASM)</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #090A0E;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    display: block;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #ime {
    position: fixed;
    left: 0;
    top: 0;
    width: 2px;
    height: 20px;
    opacity: 0;
    padding: 0;
    border: 0;
    resize: none;
    overflow: hidden;
    font-size: 16px;
    caret-color: transparent;
    color: transparent;
    background: transparent;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<textarea id="ime" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
<script src="host.js"></script>
<script type="module">
import { createPionRuntime } from "./pion_wasm_rt_web.mjs";
import { attachHostBridge } from "./pion_host_bridge.mjs";

const params = new URLSearchParams(location.search);
const wasmUrl = params.get("wasm") || "lg_web.wasm";

const perf = {
  wasmUrl,
  wasmFetchMs: 0,
  compileInstantiateMs: 0,
  firstFrameMs: 0,
  wasmBytes: 0,
  memoryMB: 0,
  frameCount: 0,
  frameTimesMs: [],
};
window.__perf = perf;
window.__invarReady = false;

const rt = createPionRuntime({
  print: (s) => console.log(s),
  println: (s) => console.log(s),
  eprintln: (s) => console.error(s),
});

const { frameTimes } = attachHostBridge(rt, {
  onFirstFrame(dt) {
    perf.firstFrameMs = dt;
    const mem = rt.getMemory();
    perf.memoryMB = mem ? Number((mem.buffer.byteLength / (1024 * 1024)).toFixed(2)) : 0;
    window.__invarReady = true;
  },
  onFrame(dt) {
    perf.frameCount++;
    perf.frameTimesMs = frameTimes;
    const mem = rt.getMemory();
    if (mem) perf.memoryMB = Number((mem.buffer.byteLength / (1024 * 1024)).toFixed(2));
  },
});

async function boot() {
  const tFetch0 = performance.now();
  const resp = await fetch(wasmUrl);
  if (!resp.ok) throw new Error(`Failed to fetch ${wasmUrl}: ${resp.status}`);
  const bytes = await resp.arrayBuffer();
  const tFetch1 = performance.now();
  perf.wasmFetchMs = Number((tFetch1 - tFetch0).toFixed(2));
  perf.wasmBytes = bytes.byteLength;

  const tComp0 = performance.now();
  const { instance } = await WebAssembly.instantiate(bytes, rt.imports);
  const tComp1 = performance.now();
  perf.compileInstantiateMs = Number((tComp1 - tComp0).toFixed(2));

  rt.bindExports(instance.exports);
  const mem = rt.getMemory();
  perf.memoryMB = mem ? Number((mem.buffer.byteLength / (1024 * 1024)).toFixed(2)) : 0;
  window.__pionInstance = instance;

  if (instance.exports.main) {
    instance.exports.main(0, 0n);
  } else if (instance.exports._start) {
    instance.exports._start();
  }
}

boot().catch((err) => {
  console.error("invar boot error:", err);
  window.__bootError = String(err && err.stack ? err.stack : err);
});
</script>
</body>
</html>
